<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La BuenGuia · Editor local</title><link rel="stylesheet" href="./editor.css"></head>
<body><main><header><h1>La BuenGuia</h1><p>Editor local de establecimientos · Solo para tu ordenador</p></header>
<section class="notice"><strong>Editor local.</strong> Guarda los establecimientos en tu ordenador. Para usarlo, ejecuta <code>iniciar_editor.bat</code>. Guardar no publica en GitHub.</section>
<section class="management"><h2>Mis establecimientos</h2><label>Seleccionar establecimiento<select id="venue-select"><option value="">Nuevo establecimiento</option></select></label><button type="button" id="edit-venue">Editar seleccionado</button><button type="button" id="new-venue" class="secondary">Nuevo establecimiento</button></section><form id="venue-form">
<h2 id="form-heading">Nuevo establecimiento</h2>
<div class="grid">
<label>Nombre *<input name="nombre" required maxlength="160" placeholder="Nombre del establecimiento"></label>
<label>Tipo *<select name="tipo" required><option value="">Seleccionar</option><option>Restaurante</option><option>Cafetería</option><option>Bar</option><option>Pub</option><option>Otros</option></select></label>
<label>Estado *<select name="estado" required><option>Quiero ir</option><option>Visitado</option></select></label>
<label>Precio <select name="precio"><option value="">Sin indicar</option><option value="1">€</option><option value="2">€€</option><option value="3">€€€</option><option value="4">€€€€</option></select></label>
<label>Dirección<input name="direccion" placeholder="Calle, ciudad, país"></label>
<label>Latitud *<input name="lat" type="number" step="any" min="-90" max="90" required placeholder="Ej. 40.4168"></label>
<label>Longitud *<input name="lon" type="number" step="any" min="-180" max="180" required placeholder="Ej. -3.7038"></label>
</div>
<fieldset><legend>Etiquetas</legend><div id="tag-options" class="tags"></div></fieldset>
<label>Notas generales<textarea name="notas" rows="4" placeholder="Observaciones sobre el establecimiento"></textarea></label>
<div class="actions"><button type="submit">Guardar establecimiento</button><button type="reset" class="secondary">Limpiar</button></div>
</form><p id="save-message" role="status" aria-live="polite"></p>
<section id="preview" hidden aria-live="polite"><h2>Último establecimiento guardado</h2><pre id="preview-json"></pre></section>
</main><script type="module" src="./editor.js"></script></body></html>
